[project]
name = "cpu-bound-app"
version = "0.1.0"
description = "CPU-Bound benchmark application for resource provisioning experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "psutil>=5.9.8",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
